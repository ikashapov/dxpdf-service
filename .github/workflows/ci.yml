# Build and test on every push/PR.
#
# The engine is a git dependency pinned by tag in Cargo.toml (see README,
# "Which dxpdf this builds against"); cargo fetches it, so nothing else is
# checked out. Bumping the engine is editing that one line.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  windows:
    name: Windows (fmt, clippy, test, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dxpdf-service
    steps:
      - uses: actions/checkout@v6
        with:
          path: dxpdf-service
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dxpdf-service
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  # The console (`run`) mode is cross-platform; a Linux build keeps it that way.
  linux:
    name: Linux (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dxpdf-service
    steps:
      - uses: actions/checkout@v6
        with:
          path: dxpdf-service
      # dxpdf's system dependencies on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dxpdf-service
      - run: cargo test
      - run: cargo build --release
