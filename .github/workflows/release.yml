# Build the Windows binary and publish it as a GitHub Release.
#
# Trigger: push a tag `vX.Y.Z`. Two guards fail the run early: the tag must
# match Cargo.toml's version, and CHANGELOG.md must have a `## vX.Y.Z` section,
# which becomes the release body.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dxpdf-service
    steps:
      - uses: actions/checkout@v6
        with:
          path: dxpdf-service

      - name: Check that the tag matches Cargo.toml
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($cargo -ne $tag) {
            throw "Cargo.toml version $cargo does not match tag $tag"
          }

      - name: Take the release body from CHANGELOG.md
        shell: bash
        run: |
          awk -v tag='${{ github.ref_name }}' '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            /^## /                   { on = 0 }
            on                       { print }
          ' CHANGELOG.md > release-body.md
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "CHANGELOG.md has no '## ${{ github.ref_name }}' section" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dxpdf-service

      - run: cargo test
      - run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $name = "dxpdf-service-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory -Path pkg/$name | Out-Null
          Copy-Item target/release/dxpdf-service.exe, README.md, README.ru.md pkg/$name/
          Compress-Archive -Path pkg/$name -DestinationPath "pkg/$name.zip"
          Get-FileHash "pkg/$name.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $name.zip" } |
            Set-Content "pkg/$name.zip.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dxpdf-service/release-body.md
          files: |
            dxpdf-service/pkg/*.zip
            dxpdf-service/pkg/*.sha256
