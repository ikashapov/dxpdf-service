[package]
name = "dxpdf-service"
version = "1.0.0"
edition = "2021"
description = "HTTP service (Windows service) converting DOCX to PDF via dxpdf"
license = "MIT"
publish = false

[dependencies]
dxpdf = { path = "../dxpdf" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[profile.release]
# Match dxpdf's own release profile defaults; keep symbols small.
strip = "symbols"
